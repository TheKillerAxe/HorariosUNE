<navbarr [Usuario]="Usuario"></navbarr>

<div class="titulo">
    <div class="titulotxt">
        Disponibilidad Horario Ingles 
    </div>
</div>

<div class="contenedor-grid">
    <div class="contenedor">
        <div class="txtcuadro">
            Periodicidad
        </div>
        <div class="datos">
            <select id="periodicidad" class="form-select input a" (change)="obtenerCiclos()"
                (change)="cargarDisponibilidad()" [(ngModel)]="Disponibilidad.Periodicidad">
                <option value="" disabled selected hidden>--Seleccionar Periodicidad--</option>
                <option>Cuatrimestral</option>
                <option>Semestral</option>
            </select>
        </div>
    </div>
    <div class="contenedor">
        <div class="txtcuadro">
            Ciclo<br> escolar
        </div>
        <div class="datos">
            <select id="ciclo" class="form-select input a" disabled="true" (change)="cargarDisponibilidad()"
                [(ngModel)]="Disponibilidad.Ciclo">
                <option value="" disabled selected hidden>--Seleccionar Ciclo--</option>
                <option *ngFor="let ciclo of Ciclos" [value]="ciclo">{{ciclo}}</option>
            </select>
        </div>
    </div>
    <div class="contenedor">
        <div class="txtcuadro">
            Periodo
        </div>
        <div class="datos">
            <select id="periodo" class="form-select input a" (change)="cargarDisponibilidad()"
                [(ngModel)]="Disponibilidad.Periodo">
                <option value="" disabled selected hidden>--Seleccionar Periodo--</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
                <option>6</option>
                <option>7</option>
                <option>8</option>
                <option>9</option>
            </select>
        </div>
    </div>
    <div class="contenedor">
        <button class=" b3" (click)="cambiosguardados()">Guardar Cambios</button>
    </div>
</div>

<div class="horario-container">
    <div class="horario">
        <div class="dias">Días</div>
        <div class="dia">Lunes</div>
        <div class="dia">Martes</div>
        <div class="dia">Miercoles</div>
        <div class="dia">Jueves</div>
        <div class="dia">Viernes</div>
        <div class="dia">Sabado</div>

        <div *ngFor="let columna of Disponibilidad.Disponibilidad; index as i;">
            <div *ngFor="let fila of columna.registro; index as j">
                <div *ngIf="i==0" class="hora">{{fila.texto}}</div>
                <div *ngIf="i!=0" class="celda" id="c{{i}}{{j}}" (click)="openSwalModal(i, j)">
                    {{fila.periodicidad}} <br>
                    {{fila.periodo}} <br>
                    {{fila.salon}}
                </div>
            </div>
        </div>
    </div>
</div>
