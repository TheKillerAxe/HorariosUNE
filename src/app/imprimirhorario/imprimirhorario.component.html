<navbarr [Usuario]="Usuario"></navbarr>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto+Slab&display=swap');
</style>

<div class="titulo">
    <div class="titulotxt">
        Imprimir horarios
    </div>
</div>

<div class="subtitulo">
    <div class="subtitulotxt">
        Horarios Grupales
    </div>
</div>

<div class="parent" id="htmlData">
    <div class="div2">
        <label class="texto" for="nombre">Ciclo Escolar:</label><br>
        <select class="inputcss" id="tipoDocente" name="tipoDocente" [(ngModel)]="Horario.Ciclo">
            <option>2023-01</option>
            <option>2023-02</option>
            <option>2023-03</option>
        </select>
    </div>
    <div class="div3">
        <label class="texto" for="tipoDocente">Carrera:</label><br>
        <select class="inputcss" id="tipoDocente" name="tipoDocente" [(ngModel)]="Horario.Carrera">
            <option>ISCE</option>
            <option>IIS</option>
            <option>IP</option>
        </select>
    </div>
    <div class="div4">
        <label class="texto" for="contraseña">Periodo:</label><br>
        <input class="inputcss" type="password" id="contraseña" name="contraseña" [(ngModel)]="Horario.Periodo">
    </div>
    <div class="div6">
        <button class="botonune" (click)="buscarHorario()">Imprimir Horario</button>

    </div>
</div>
<hr>
<div class="subtitulo">
    <div class="subtitulotxt">
        Horarios de Docentes
    </div>
</div>

<div class="parent2">
    <div class="div3">
        <label class="texto" for="tipoDocente">Docente:</label><br>
        <select class="inputcss" id="tipoDocente" name="tipoDocente" [(ngModel)]="Docente">
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
        </select>

    </div>
    <div class="div6">
        <button class="botonune">Imprimir Horario</button>

    </div>
</div>
