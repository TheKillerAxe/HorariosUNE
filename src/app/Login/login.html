<body style="background-color: #ffffff;">
 
    <div style="display: flex;">
 

        <!--div de la chica-->
   
            
             <img style="width:48%;" src="https://i.imgur.com/oSjoRGS.png" alt="">
            
   
     <div style="width:30%;">
        <div class="container">
            <div style="height: 120%;">
               <img  style="height: auto ;width:80%; margin-left: 10%; margin-top: 10%; margin-bottom: 10%;" src="https://i.imgur.com/ynuYUHq.png" alt="">
               <form  method="POST">
              <div class="form-group">
                  <div style="margin-left: 10%;color: #aaa8a8;margin-top: 5%;"><label for="usuario">Usuario</label></div>
                  <div style="display: flex;">
                    <div style="width: 70%;margin-left: 10%;">
                      <input type="text" id="usuario" name="usuario" required autocomplete="off" [(ngModel)]="this.Usuario.NombreUsuario">
                    </div>
                   
                  <div style="margin-left: 5%;"><button class="btn1">
                    <svg style="margin-bottom: 20%;" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-question-lg" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M4.475 5.458c-.284 0-.514-.237-.47-.517C4.28 3.24 5.576 2 7.825 2c2.25 0 3.767 1.36 3.767 3.215 0 1.344-.665 2.288-1.79 2.973-1.1.659-1.414 1.118-1.414 2.01v.03a.5.5 0 0 1-.5.5h-.77a.5.5 0 0 1-.5-.495l-.003-.2c-.043-1.221.477-2.001 1.645-2.712 1.03-.632 1.397-1.135 1.397-2.028 0-.979-.758-1.698-1.926-1.698-1.009 0-1.71.529-1.938 1.402-.066.254-.278.461-.54.461h-.777ZM7.496 14c.622 0 1.095-.474 1.095-1.09 0-.618-.473-1.092-1.095-1.092-.606 0-1.087.474-1.087 1.091S6.89 14 7.496 14Z"/>
                  </svg>
                </button>
                   
              </div>
                </div>                
              </div>
              <label style="margin-left: 10%;color: #aaa8a8;margin-top: 5%;" for="contrasena">Contraseña</label>
              <div style="width: 70%;margin-left: 10%;">
                <input type="password" id="contrasena" name="contrasena" required [(ngModel)]="this.Usuario.Contrasena">
            </div>
           
            
              <div class="form-group"> 
                <button type="submit" class="btn" style="font-size: 150%;" (click)="login()">Entrar</button>
              </div>
         
          </form>
            </div>
        
      </div>
      </div>
      
    </div>
  </body>
