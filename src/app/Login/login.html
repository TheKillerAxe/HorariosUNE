  <style>


body {

	font-family: Helvetica;
	background: #eee;
  -webkit-font-smoothing: antialiased;
  border-radius: 5%;
}

hgroup { 
	text-align:center;
	margin-top: 4em;
}

h1, h3 { font-weight: 300; }

h1 { color: #636363; }

h3 { color: #B60D44; }

form {
  margin-top: 8%;
  margin-left: 15%;
	width: 30%;
  height: 65%;
	padding: 2em 2em 2em 2em;
	background: #fafafa;
	border: 1px solid #ebebeb;
	box-shadow: rgba(0,0,0,0.14902) 2px 2px 2px 2px,rgba(0,0,0,0.09804) 2px 2px 2px 2px;
  border-radius: 5%;
}

.group { 
	position: relative; 
	margin-bottom: 45px; 
}

input {
	font-size: 18px;
	padding: 10px 10px 10px 5px;
	-webkit-appearance: none;
	display: block;
	background: #fafafa;
	color: #636363;
	width: 100%;
	border: none;
	border-radius: 0;
	border-bottom: 1px solid #757575;
}

input:focus { outline: none; }


/* Label */

label {
	color: #999; 
	font-size: 18px;
	font-weight: normal;
	position: absolute;
	pointer-events: none;
	left: 5px;
	top: 10px;
	transition: all 0.2s ease;
}


/* active */

input:focus ~ label, input.used ~ label {
	top: -20px;
  transform: scale(.75); left: -2px;
	/* font-size: 14px; */
	color: #B60D44;
}


/* Underline */

.bar {
	position: relative;
	display: block;
	width: 100%;
}

.bar:before, .bar:after {
	content: '';
	height: 2px; 
	width: 0;
	bottom: 1px; 
	position: absolute;
	background: #B60D44; 
	transition: all 0.2s ease;
}

.bar:before { left: 50%; }

.bar:after { right: 50%; }


/* active */

input:focus ~ .bar:before, input:focus ~ .bar:after { width: 50%; }


/* Highlight */

.highlight {
	position: absolute;
	height: 60%; 
	width: 100px; 
	top: 25%; 
	left: 0;
	pointer-events: none;
	opacity: 0.5;
}


/* active */

input:focus ~ .highlight {
	animation: inputHighlighter 0.3s ease;
}


/* Animations */

@keyframes inputHighlighter {
	from { background: #B60D44; }
	to 	{ width: 0; background: transparent; }
}


/* Button */

.button {
  height: 25%;
  position: relative;
  display: block;
  margin: 8% auto 0; /* Cambiado el margen superior a 5% */
  padding: 12px 24px;
  width: auto;
  vertical-align: middle;
  color: #fff;
  font-size: 16px;
  line-height: 100%;
  text-align: center;
  letter-spacing: 1px;
  background: transparent;
  border: 0;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.15s ease;
}

.button:focus { outline: 0; }

.buttonBlue {
  background: #B60D44;

}

.buttonBlue:hover { background: #c02659; }



  </style>
