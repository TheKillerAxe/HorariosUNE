<style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto+Slab&display=swap');
</style>

<navbarr [Usuario]="Usuario"></navbarr>

<div class="titulo">
    <div class="titulotxt">
        GENERACIÓN DE HORARIOS
    </div>
</div>

<div class="contenedor-grid">
    <div class="contenedor">
        <div class="txtcuadro">
            Ciclo<br> escolar
        </div>
        <div class="datos">
            <select id="disabledSelect" class="form-select input a" [(ngModel)]="ciclo">
                <option>2023/01</option>
                <option>2023/02</option>
                <option>2023/03</option>
            </select>
        </div>
    </div>
    <div class="contenedor">
        <div class="txtcuadro">
            Carrera
        </div>
        <div class="datos">
            <select id="disabledSelect" class="form-select input a" [(ngModel)]="carrera">
                <option>ISCE</option>
                <option>IIS</option>
                <option>IP</option>
            </select>
        </div>
    </div>
    <div class="contenedor">
        <div class="txtcuadro">
            Periodo
        </div>
        <div class="datos">
            <select id="disabledSelect" class="form-select input a" [(ngModel)]="periodo">
                <option>1</option>
                <option>2</option>
                <option>3</option>
            </select>
        </div>
    </div>
    <div class="contenedor">
        <div class="txtcuadro">
            Materia
        </div>
        <div class="datos">
            <select id="disabledSelect2" class="form-select input a" [(ngModel)]="materia">
                <option>Programación</option>
                <option>Algebra</option>
                <option>Costos</option>
            </select>
        </div>
    </div>
    <div class="contenedor">
        <div class="txtcuadro">
            Maestro
        </div>
        <div class="datos">
            <select id="disabledSelect3" class="form-select input a" [(ngModel)]="maestro">
                <option>Myriam Janeth</option>
                <option>Felipe Perez</option>
                <option>Denisse Mendoza</option>
            </select>
        </div>
    </div>
</div>

<div class="contenedor-botones">
    <button type="button" class="btn b" style="margin-left: 40px;">Dividir materia</button>
    <button type="button" class="btn b" style="margin-left: 1180px;" (click)="cambiosguardados()">Guardar
        Cambios</button>


</div>

<div class="horario-container">
    <div class="horario">
        <div class="dias">Días</div>
        <div class="dia">Lunes</div>
        <div class="dia">Martes</div>
        <div class="dia">Miercoles</div>
        <div class="dia">Jueves</div>
        <div class="dia">Viernes</div>
        <div class="dia">Sabado</div>

        <div *ngFor="let columna of horario; index as i; let first = first">
            <div *ngFor="let fila of columna; index as j">
                <div *ngIf="!first" class="celda" id="c{{i}}{{j}}" (click)="openSwalModal(i, j)">
                    {{fila.maestro}} <br>
                    {{fila.texto}} <br>
                    {{fila.salon}}
                </div>
            </div>
        </div>


    </div>
</div>

<button type="button" class="btn b1" style="margin-left: 1380px;" (click)="ejecutarFunciones()">+</button>


<div *ngIf="mostrarHorario2" class="titulo">

    <div class="titulotxt">
        Horario Irregular
    </div>

</div>


<div *ngIf="mostrarHorario" class="horario-container" style="margin-bottom: 30px;">
    <div class="horario">

        <div class="dias">Días</div>
        <div class="dia">Lunes</div>
        <div class="dia">Martes</div>
        <div class="dia">Miercoles</div>
        <div class="dia">Jueves</div>
        <div class="dia">Viernes</div>
        <div class="dia">Sabado</div>

        <div *ngFor="let columna of horario; index as i; let first = first">
            <div *ngFor="let fila of columna; index as j">
                <div *ngIf="!first" class="celda" id="c{{i}}{{j}}" (click)="openSwalModal(i, j)">
                    {{fila.maestro}} <br>
                    {{fila.texto}} <br>
                    {{fila.salon}}
                </div>
            </div>
        </div>


    </div>
</div>
